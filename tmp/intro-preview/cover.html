<!doctype html><html><head><base href="file:///C:/Users/Gwenneth/Desktop/TETRIS/"><style>﻿* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    color-scheme: dark;
    --cream: #fff4d1;
    --gold: #ffd76a;
    --gold-strong: #ffb341;
    --wood: #653316;
    --panel-dark: #20160e;

body {
    min-height: 100vh;

    padding: 20px 10px;

}
.game {
    width: min(100%, 680px);
    margin: auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2.5fr) minmax(0, 1fr);
    grid-template-areas: "brand brand brand" "stats board next";
    align-items: start;
    gap: 18px 14px;
    padding: 22px 18px 18px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(30, 17, 11, 0.72), rgba(46, 25, 12, 0.8));
    border: 2px solid rgba(255, 213, 118, 0.28);
    box-shadow: 0 20px 38px rgba(17, 9, 2, 0.5), inset 0 0 0 1px rgba(255, 234, 170, 0.12), 0 0 25px rgba(255, 174, 73, 0.09);
    backdrop-filter: blur(2px);

.brand {
    grid-area: brand;
    text-align: center;
    padding: 8px 0 12px;
    filter: drop-shadow(0 4px 2px rgba(62, 27, 11, 0.85));
}

.brand-row {
    display: flex;

.eagle-e {
    display: inline-block;
    width: .95em;
    height: 1em;
    vertical-align: -.12em;
    position: relative;
    letter-spacing: 0;
    filter: drop-shadow(0 2px 3px #3c1c0c);
}
.eagle-icon { display: block; width: 100%; height: 100%; overflow: visible; }
.eagle-wing { transform-box: view-box; transform-origin: 50px 55px; }
.intro-screen.fade-out .eagle-e { animation: eagleTakeoff 1.2s ease-in forwards; }
.intro-screen.fade-out .wing-left { animation: flapLeft .22s ease-in-out infinite alternate; }
.intro-screen.fade-out .wing-right { animation: flapRight .22s ease-in-out infinite alternate; }
@keyframes eagleTakeoff {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    20% { transform: translate(12px, -25px) scale(1.15) rotate(-8deg); opacity: 1; }
    65% { transform: translate(100px, -130px) scale(.9) rotate(12deg); opacity: 1; }
    100% { transform: translate(220px, -280px) scale(.35) rotate(18deg); opacity: 0; }
}
@keyframes flapLeft { to { transform: rotate(26deg) scaleX(.75); } }
@keyframes flapRight { to { transform: rotate(-26deg) scaleX(.75); } }

/* Fit available phone space while preserving the 10 x 20 board. */
html { min-width: 0; }
body {
    min-height: 100svh;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-right: max(8px, env(safe-area-inset-right));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(8px, env(safe-area-inset-left));
}
.game > *, .auth-panel, .auth-form, .field-group { min-width: 0; }
.auth-screen { min-height: calc(100svh - 24px); padding: 12px 0; }
.auth-form input { width: 100%; min-width: 0; font-size: 16px; }
.guest-link { min-height: 44px; }
.intro-screen { overflow: hidden; padding: 12px; }
.intro-logo { max-width: 100%; }
.intro-logo h1 { font-size: clamp(24px, 8vw, 72px); }
button { touch-action: manipulation; }

@media (max-width: 700px), (max-width: 950px) and (orientation: landscape) {
    body { background-attachment: scroll; }
    body:has(#gameScreen:not(.hidden)) { display: flex; flex-direction: column; justify-content: center; }
    body:has(#gameScreen:not(.hidden)) { padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: max(4px, env(safe-area-inset-bottom)); }
    .game {
        width: min(100%, 520px);
        grid-template-columns: 44px minmax(0, 1fr) 52px;
        grid-template-areas: "brand brand brand" "stats board next";
        gap: 5px;
        padding: 4px 5px 6px;
        border-radius: 20px;
    }
    .brand { padding: 0; }
    .brand .small-title, .location { display: none; }
    .brand h1 { font-size: clamp(16px, 4.5vw, 22px); letter-spacing: 0; }
    .match-toolbar { gap: 5px; margin-bottom: 2px; font-size: 9px; }
    .match-toolbar button { min-height: 30px; padding: 2px 6px; font-size: 9px; }
    .small-title { font-size: 9px; letter-spacing: 2px; margin-bottom: 4px; }
    .side-panel { padding-top: 0; gap: 4px; }
    .left-panel { display: flex; flex-direction: column; }
    .right-panel { display: flex; flex-direction: column; }
    .info-card, .next-card { border-width: 2px; border-radius: 10px; }
    .info-card p, .next-card > p { padding: 2px 0; font-size: 7px; letter-spacing: 0; }
    .info-card h2 { padding: 1px 0; font-size: 13px; }
    .center { width: 100%; }
    .board-frame {
        width: min(100%, 340px, max(134px, calc((100svh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 2 + 14px)));
        margin: 0 auto;
        padding: 5px;
        border-width: 2px;
        border-radius: 12px;
    }
    #gameCanvas { width: 100%; max-width: none; height: auto; }
    .game-message { inset: 5px; }
    .game-message h2 { font-size: 18px; }
    .game-message p { font-size: 11px; overflow-wrap: anywhere; }
    .next-card { min-height: 0; padding-bottom: 4px; }
    #nextCanvas { width: 100%; max-width: 100px; margin-top: 4px; }
    .tip-card { display: none; }
    .bottom-panel { margin: 0; padding: 8px; border-width: 2px; }
    .game-controls { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .game-controls button { font-size: 22px; min-height: 44px; min-width: 0; }
    #dropButton { grid-column: 1 / -1; min-height: 44px; font-size: 11px; }
    .menu-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .menu-button { min-height: 44px; font-size: 11px; letter-spacing: 1px; }
    .auth-panel { padding: 20px 16px 18px; }
    .auth-brand h1 { font-size: clamp(22px, 7vw, 38px); }
    .auth-form input, .primary-button, .social-button { min-height: 46px; }
}
@media (max-width: 350px) {
    .game { grid-template-columns: 38px minmax(0, 1fr) 44px; gap: 4px; padding-inline: 4px; }
}
@media (max-height: 600px) and (orientation: landscape) {
    .auth-screen { place-items: start center; }
    .tip-card { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    .intro-logo { animation: none; }
    .intro-screen.fade-out .eagle-e { animation: eagleQuietFade 1.2s ease forwards; }
    .intro-screen.fade-out .eagle-wing { animation: none; }
}
@keyframes eagleQuietFade { to { opacity: 0; } }

/* Capture gestures only on the board; the rest of the page still scrolls. */
.board-frame { touch-action: none; user-select: none; -webkit-user-select: none; }

    padding:0;
    border:0;
    border-radius:0;
    background:none;
    box-shadow:none;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
}
#gameScreen .brand { position:absolute; top:max(18px,env(safe-area-inset-top)); left:22px; right:22px; padding:0; filter:none; }
#gameScreen .brand-row,#gameScreen .brand .location { display:none; }
#gameScreen .match-toolbar { display:grid; grid-template-columns:1fr auto auto 1fr; gap:16px; margin:0; color:#fff1d1; font-size:14px; font-weight:750; text-shadow:0 2px 4px #160900; }
#gameScreen .match-toolbar button { min-height:45px; padding:10px 17px; border:1px solid #ffdd8b; border-radius:10px; background:linear-gradient(135deg,rgba(84,39,7,.88),rgba(27,12,4,.9)); box-shadow:inset 0 0 0 2px #a86b323b,0 0 15px #ffb62233; color:#fff2db; font-size:14px; font-weight:750; letter-spacing:0; }
#gameScreen #openMatchMenu { justify-self:start; }
#gameScreen #pauseButton { justify-self:end; }
#gameScreen #matchClock { font-variant-numeric:tabular-nums; }
#gameScreen .side-panel { min-width:0; height:var(--play-height); padding:0; gap:12px; }
#gameScreen .left-panel { justify-content:center; }
#gameScreen .info-card,#gameScreen .hold-card,#gameScreen .next-card,#gameScreen .opponent-card {
    position:relative;
    flex-shrink:0;
    border:1px solid #ffc954;
    border-radius:13px;
    background:linear-gradient(125deg,rgba(91,44,8,.88),rgba(25,12,3,.94) 65%);
    box-shadow:inset 0 0 0 3px #8c4c1f44,inset 0 1px 0 #ffebba,0 0 12px #ffad3d3b,0 12px 25px #13090288;
    -webkit-backdrop-filter:blur(9px);
    backdrop-filter:blur(9px);
}
#gameScreen .info-card { flex:0 0 102px; display:flex; flex-direction:column; justify-content:center; }
#gameScreen .info-card::before { content:""; position:absolute; left:6px; top:8px; bottom:8px; width:10px; opacity:.55; background:repeating-linear-gradient(45deg,transparent 0 4px,#d78b29 4px 5px,transparent 5px 9px); border-left:1px solid #e7a33a; }
#gameScreen .info-card p { padding:0 8px 5px; border:0; color:#ffd58a; font-size:14px; }
#gameScreen .info-card h2 { padding:0 8px; background:none; color:#fff7e6; font-size:32px; line-height:1.2; }
#gameScreen .game-mode-info { padding:9px; border-color:#bc813c88; background:#251405c9; font-size:11px; }
#gameScreen #gameLevelProgress { flex:none; height:7px; }
#gameScreen .center { width:var(--board-width); }
#gameScreen .board-frame { width:100%; max-width:none; margin:0; padding:8px; border:2px solid #ffcf68; border-radius:9px; background:linear-gradient(90deg,#502505,#f1b444 1%,#4c2309 2%,#2b1709 98%,#d99625 99%,#5e2d07); box-shadow:inset 0 0 0 2px #5d310e,0 0 0 2px #7c430e,0 0 19px #ffb73366,0 16px 30px #160a0788; -webkit-backdrop-filter:none; backdrop-filter:none; }
#gameScreen .board-frame::after { content:""; position:absolute; inset:-4px; background:url('Assets/game/frame-ornament.svg') center / 100% 100% no-repeat; pointer-events:none; }
#gameScreen #gameCanvas { width:100%; max-width:none; height:auto; border-radius:0; background:#130b05; }
#gameScreen .game-message { inset:9px; border:0; border-radius:0; background:#1e1007d9; }
#gameScreen .right-panel { gap:18px; }
#gameScreen .hold-card { padding:10px 14px 12px; }
#gameScreen .hold-card p,#gameScreen .next-card > p { padding:0 0 9px; border:0; color:#fff0ce; font-size:17px; letter-spacing:.5px; line-height:1.25; }
#gameScreen .hold-card p small { display:block; margin-top:3px; font-size:9px; font-weight:500; color:#c49c6a; }
#gameScreen #holdCanvas { width:100%; height:auto; max-height:calc(var(--play-height) * .16); object-fit:contain; background:#1d0e04; border-radius:7px; }
#gameScreen .next-card { flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 14px 14px; }
#gameScreen #nextCanvas { flex:1; min-height:0; height:0; width:100%; max-width:none; margin:0; object-fit:contain; background:#1d0e04; border-radius:7px; }
#gameScreen:not(.is-online) .opponent-card { display:none; }
#gameScreen.is-online .left-panel { justify-content:start; }
#gameScreen.is-online .opponent-card { flex:none; width:100%; padding:10px 12px; margin:0; }
#gameScreen .opponent-heading { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
#gameScreen .opponent-heading p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-weight:800; font-size:13px; }
#gameScreen .opponent-avatar { display:grid; place-items:center; width:32px; height:32px; flex:none; border:1px solid #ffd46e; border-radius:50%; background:linear-gradient(140deg,#b56f20,#492508); color:#ffe4a0; }
#gameScreen .opponent-live { font-size:8px; letter-spacing:1px; color:#94ecac; }
#gameScreen .opponent-live.is-offline { color:#c9b494; }
#gameScreen #opponentCanvas { width:auto; height:calc(var(--play-height) * .34); max-width:100%; margin:auto; border:1px solid #a77232; border-radius:2px; }
#gameScreen .opponent-card small { margin-top:7px; font-size:10px; color:#f4d28e; }
#gameScreen.is-online .info-card { flex:1; min-height:52px; }
#gameScreen.is-online .info-card h2 { font-size:27px; }
#gameScreen.is-online .info-card p { font-size:12px; }
@media(max-width:760px) {
    #gameScreen.game { --play-height:min(620px,calc(100svh - 110px)); --side-width:70px; max-width:calc(100% - 16px); gap:8px; margin-top:78px; grid-template-columns:70px minmax(0,var(--board-width)) 70px; }
    #gameScreen .brand { left:10px; right:10px; top:12px; }
    #gameScreen .match-toolbar { gap:8px; font-size:10px; }
    #gameScreen .match-toolbar button { min-height:38px; padding:6px 10px; font-size:11px; }
    #gameScreen .center { width:100%; }
    #gameScreen .side-panel { height:auto; min-height:0; gap:8px; }
    #gameScreen .info-card { flex:none; height:70px; }
    #gameScreen .info-card p { font-size:9px; }
    #gameScreen .info-card h2 { font-size:21px; }
    #gameScreen .game-mode-info { padding:5px 3px; font-size:8px; }
    #gameScreen .right-panel { align-self:stretch; }
    #gameScreen .hold-card,#gameScreen .next-card { padding:8px 5px; border-radius:9px; }
    #gameScreen .hold-card p,#gameScreen .next-card > p { font-size:10px; padding-bottom:5px; }
    #gameScreen .hold-card p small { display:none; }
    #gameScreen #holdCanvas { max-height:60px; }
    #gameScreen #nextCanvas { min-height:0; }
    #gameScreen.is-online .opponent-card { padding:5px 3px; }
    #gameScreen .opponent-heading { flex-wrap:wrap; justify-content:center; gap:3px; }
    #gameScreen .opponent-heading p { flex-basis:100%; text-align:center; font-size:9px; }
    #gameScreen .opponent-avatar { width:24px; height:24px; }
    #gameScreen .opponent-live { display:none; }
    #gameScreen #opponentCanvas { width:100%; height:auto; }
    #gameScreen .opponent-card small { font-size:8px; }
    #gameScreen.is-online .info-card { flex:none; min-height:0; height:58px; }
    #gameScreen.is-online .info-card p { font-size:9px; }
    #gameScreen.is-online .info-card h2 { font-size:20px; }
}
@media(max-width:420px) {
    #gameScreen.game { --side-width:54px; grid-template-columns:54px minmax(0,var(--board-width)) 54px; gap:6px; }
    #gameScreen .board-frame { padding:5px; border-width:1px; }
    #gameScreen .game-message { inset:6px; }
    #gameScreen .info-card::before { display:none; }
    #gameScreen .hold-card p,#gameScreen .next-card > p { font-size:8px; }
}
@media(max-height:580px) and (min-width:761px) {
    #gameScreen.game { --side-width:150px; --play-height:calc(100svh - 88px); margin-top:68px; gap:14px; }
    #gameScreen .side-panel { gap:6px; }
    #gameScreen .info-card { flex:0 1 72px; }
    #gameScreen .info-card h2 { font-size:23px; }
    #gameScreen .info-card p { font-size:10px; }
    #gameScreen.is-online .info-card { flex:1; min-height:35px; }
    #gameScreen .game-mode-info { font-size:8px; padding:4px; }
    #gameScreen .right-panel { gap:9px; }
    #gameScreen .hold-card p,#gameScreen .next-card > p { font-size:12px; }
}
